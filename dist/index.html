<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A focused calendar and task list for university students.">
  <meta name="theme-color" content="#132238">
  <title>Campus Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23132238'/%3E%3Cpath d='M18 14v8M46 14v8M14 25h36v25H14z' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='m22 37 6 6 14-15' fill='none' stroke='%23ffcc66' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #132238;
      --muted: #617086;
      --paper: #f5f7fb;
      --surface: #ffffff;
      --line: #dfe5ee;
      --accent: #2762d7;
      --accent-soft: #e9f0ff;
      --event: #16796d;
      --event-soft: #e3f4f1;
      --task: #9a5b00;
      --task-soft: #fff0d2;
      --danger: #b3261e;
      --shadow: 0 18px 55px rgba(19, 34, 56, .09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 21px; box-shadow: 0 7px 18px rgba(19,34,56,.18); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.45rem, 3vw, 2rem); letter-spacing: -.04em; }
    .eyebrow { color: var(--muted); font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .top-actions { display: flex; gap: 9px; }
    .button { border: 0; border-radius: 10px; padding: 10px 15px; min-height: 42px; background: var(--ink); color: #fff; font-weight: 750; transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
    .button:hover { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(19,34,56,.16); }
    .button.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
    .button.danger { background: var(--danger); }
    .icon-button { display: inline-grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--surface); font-size: 1.1rem; }
    .calendar-card, .tasks-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .calendar-toolbar h2 { font-size: 1.18rem; letter-spacing: -.02em; }
    .month-nav { display: flex; align-items: center; gap: 8px; }
    .today-button { border: 0; background: transparent; color: var(--accent); font-weight: 750; padding: 8px; }
    .weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekdays { background: #fafbfd; border-bottom: 1px solid var(--line); }
    .weekdays div { padding: 9px 8px; text-align: center; color: var(--muted); font-size: .76rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .day { min-height: 116px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); overflow: hidden; }
    .day:nth-child(7n) { border-right: 0; }
    .day.outside { background: #fafbfd; color: #a5aebb; }
    .day.today { background: #f5f8ff; box-shadow: inset 0 0 0 2px var(--accent); }
    .day-number { display: grid; place-items: center; width: 27px; height: 27px; margin-bottom: 4px; border-radius: 8px; font-size: .86rem; font-weight: 750; }
    .today .day-number { background: var(--accent); color: #fff; }
    .calendar-item { display: block; width: 100%; margin: 4px 0 0; padding: 4px 6px; border: 0; border-radius: 6px; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: .72rem; line-height: 1.25; font-weight: 700; }
    .calendar-item.event { background: var(--event-soft); color: #0c6158; }
    .calendar-item.task { background: var(--task-soft); color: #7b4900; }
    .more { padding: 4px 2px; color: var(--muted); font-size: .72rem; font-weight: 700; }
    .legend { display: flex; gap: 18px; padding: 12px 20px; color: var(--muted); font-size: .82rem; font-weight: 650; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--event); }
    .dot.task { background: var(--task); }
    .tasks-card { margin-top: 22px; }
    .tasks-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; padding: 20px; border-bottom: 1px solid var(--line); }
    .tasks-header h2 { font-size: 1.3rem; letter-spacing: -.03em; }
    .tasks-header p { margin-top: 4px; color: var(--muted); font-size: .9rem; }
    .task-list { list-style: none; margin: 0; padding: 0 20px; }
    .task-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; align-items: center; gap: 13px; padding: 15px 0; border-bottom: 1px solid var(--line); background: var(--surface); }
    .task-row:last-child { border-bottom: 0; }
    .task-row.dragging { opacity: .42; }
    .drag-handle { color: #8a96a8; cursor: grab; font-size: 1.12rem; letter-spacing: -5px; user-select: none; }
    .task-title { font-weight: 780; overflow-wrap: anywhere; }
    .task-due { margin-top: 3px; color: var(--muted); font-size: .84rem; }
    .task-due.overdue { color: var(--danger); font-weight: 750; }
    .priority-number { display: grid; place-items: center; min-width: 31px; height: 31px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 850; }
    .row-actions { display: flex; align-items: center; gap: 5px; }
    .row-actions button { border: 0; background: transparent; color: var(--muted); border-radius: 7px; min-width: 31px; height: 31px; font-weight: 800; }
    .row-actions button:hover { background: var(--paper); color: var(--ink); }
    .row-actions .remove:hover { background: #fff0ef; color: var(--danger); }
    .empty { padding: 34px 20px 38px; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 1.03rem; }
    dialog { width: min(460px, calc(100% - 28px)); border: 0; border-radius: 17px; padding: 0; color: var(--ink); box-shadow: 0 28px 90px rgba(19,34,56,.25); }
    dialog[open] { position: fixed; inset: 50% auto auto 50%; z-index: 20; transform: translate(-50%, -50%); }
    dialog::backdrop { background: rgba(10, 20, 34, .52); backdrop-filter: blur(3px); }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 21px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { font-size: 1.25rem; }
    .dialog-body { padding: 20px 21px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: .86rem; font-weight: 780; }
    input { width: 100%; min-height: 44px; border: 1px solid #cbd3df; border-radius: 9px; padding: 9px 11px; color: var(--ink); background: #fff; }
    input:focus { outline: 3px solid rgba(39,98,215,.15); border-color: var(--accent); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
    .detail-meta { color: var(--muted); margin-top: 7px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 720px) {
      .app { width: min(100% - 18px, 1180px); padding-top: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; }
      .top-actions .button { flex: 1; padding-inline: 9px; }
      .calendar-card { border-radius: 14px; }
      .calendar-toolbar { padding: 13px 12px; }
      .weekdays div { font-size: .65rem; padding-inline: 2px; }
      .day { min-height: 84px; padding: 5px; }
      .day-number { width: 23px; height: 23px; font-size: .78rem; }
      .calendar-item { width: 9px; height: 9px; padding: 0; border-radius: 50%; color: transparent !important; display: inline-block; margin-right: 3px; }
      .more { display: none; }
      .legend { padding-inline: 12px; }
      .tasks-header { align-items: flex-start; }
      .task-list { padding: 0 14px; }
      .task-row { grid-template-columns: 24px minmax(0, 1fr) auto; gap: 9px; }
      .priority-number { display: none; }
      .row-actions button:not(.remove) { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✓</div>
        <div><div class="eyebrow">Student schedule</div><h1>Campus Planner</h1></div>
      </div>
      <div class="top-actions">
        <button class="button secondary" id="addEventButton">＋ Event</button>
        <button class="button" id="addTaskButton">＋ Task</button>
      </div>
    </header>

    <section class="calendar-card" aria-labelledby="monthLabel">
      <div class="calendar-toolbar">
        <div class="month-nav">
          <button class="icon-button" id="previousMonth" aria-label="Previous month">‹</button>
          <button class="today-button" id="todayButton">Today</button>
          <button class="icon-button" id="nextMonth" aria-label="Next month">›</button>
        </div>
        <h2 id="monthLabel"></h2>
      </div>
      <div class="weekdays" aria-hidden="true">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="legend"><span><i class="dot"></i>Event</span><span><i class="dot task"></i>Task due</span></div>
    </section>

    <section class="tasks-card" aria-labelledby="tasksTitle">
      <div class="tasks-header">
        <div><h2 id="tasksTitle">Priority list</h2><p>Drag tasks or use the arrows to reorder them.</p></div>
        <button class="button" id="addTaskButtonSecondary">＋ Add task</button>
      </div>
      <ol class="task-list" id="taskList"></ol>
      <div class="empty" id="emptyTasks"><strong>No tasks yet</strong>Add your first due date to start planning.</div>
    </section>
  </main>

  <dialog id="eventDialog">
    <form id="eventForm">
      <div class="dialog-head"><h2>Add event</h2><button type="button" class="icon-button close-dialog" aria-label="Close">×</button></div>
      <div class="dialog-body">
        <div class="field"><label for="eventTitle">Event</label><input id="eventTitle" name="title" required maxlength="80" placeholder="e.g. Biology class"></div>
        <div class="field"><label for="eventStart">Starts</label><input id="eventStart" name="start" type="datetime-local" required></div>
        <div class="field"><label for="eventEnd">Ends</label><input id="eventEnd" name="end" type="datetime-local" required></div>
        <p class="sr-only" id="eventError" role="alert"></p>
        <div class="dialog-actions"><button type="button" class="button secondary close-dialog">Cancel</button><button type="submit" class="button">Add event</button></div>
      </div>
    </form>
  </dialog>

  <dialog id="taskDialog">
    <form id="taskForm">
      <div class="dialog-head"><h2>Add task</h2><button type="button" class="icon-button close-dialog" aria-label="Close">×</button></div>
      <div class="dialog-body">
        <div class="field"><label for="taskTitle">Task</label><input id="taskTitle" name="title" required maxlength="100" placeholder="e.g. Study for chemistry test"></div>
        <div class="field"><label for="taskDue">Due</label><input id="taskDue" name="due" type="datetime-local" required></div>
        <div class="dialog-actions"><button type="button" class="button secondary close-dialog">Cancel</button><button type="submit" class="button">Add task</button></div>
      </div>
    </form>
  </dialog>

  <dialog id="eventDetailDialog">
    <div class="dialog-head"><h2 id="detailTitle">Event</h2><button type="button" class="icon-button close-dialog" aria-label="Close">×</button></div>
    <div class="dialog-body"><p class="detail-meta" id="detailTime"></p><div class="dialog-actions"><button type="button" class="button secondary close-dialog">Close</button><button type="button" class="button danger" id="deleteEvent">Delete event</button></div></div>
  </dialog>

  <script>
    (() => {
      const STORAGE_KEY = 'campus-planner-v1';
      const pad = value => String(value).padStart(2, '0');
      const localDateTime = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      const dateKey = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      const parseLocal = value => { const [d, t] = value.split('T'); const [y,m,day] = d.split('-').map(Number); const [h,min] = (t || '00:00').split(':').map(Number); return new Date(y, m - 1, day, h, min); };
      const formatTime = value => parseLocal(value).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const formatDateTime = value => parseLocal(value).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      const makeId = () => `${Date.now()}-${Math.random().toString(16).slice(2)}`;

      let state = loadState();
      let viewedMonth = new Date();
      viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth(), 1);
      let draggedTaskId = null;
      let selectedEventId = null;

      const calendarGrid = document.querySelector('#calendarGrid');
      const taskList = document.querySelector('#taskList');
      const emptyTasks = document.querySelector('#emptyTasks');
      const monthLabel = document.querySelector('#monthLabel');
      const eventDialog = document.querySelector('#eventDialog');
      const taskDialog = document.querySelector('#taskDialog');
      const detailDialog = document.querySelector('#eventDetailDialog');

      function openDialog(dialog) { if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', ''); }
      function closeDialog(dialog) { if (typeof dialog.close === 'function') dialog.close(); else dialog.removeAttribute('open'); }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.events) && Array.isArray(saved.tasks)) return saved;
        } catch (_) {}
        return { events: [], tasks: [] };
      }
      function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      function render() { renderCalendar(); renderTasks(); }

      function renderCalendar() {
        monthLabel.textContent = viewedMonth.toLocaleDateString([], { month: 'long', year: 'numeric' });
        calendarGrid.innerHTML = '';
        const first = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth(), 1);
        const gridStart = new Date(first);
        gridStart.setDate(1 - first.getDay());
        const today = dateKey(new Date());
        for (let i = 0; i < 42; i++) {
          const dayDate = new Date(gridStart);
          dayDate.setDate(gridStart.getDate() + i);
          const key = dateKey(dayDate);
          const cell = document.createElement('div');
          cell.className = `day${dayDate.getMonth() !== viewedMonth.getMonth() ? ' outside' : ''}${key === today ? ' today' : ''}`;
          cell.innerHTML = `<div class="day-number">${dayDate.getDate()}</div>`;
          const items = [
            ...state.events.filter(event => event.start.slice(0,10) === key).map(event => ({ ...event, kind: 'event', when: event.start })),
            ...state.tasks.filter(task => task.due.slice(0,10) === key).map(task => ({ ...task, kind: 'task', when: task.due }))
          ].sort((a,b) => a.when.localeCompare(b.when));
          items.slice(0, 3).forEach(item => {
            const button = document.createElement('button');
            button.className = `calendar-item ${item.kind}`;
            button.type = 'button';
            button.title = `${item.title} — ${formatTime(item.when)}`;
            button.textContent = `${item.kind === 'task' ? '✓ ' : ''}${formatTime(item.when)} ${item.title}`;
            if (item.kind === 'event') button.addEventListener('click', () => showEventDetail(item.id));
            else button.addEventListener('click', () => document.querySelector(`[data-task-id="${item.id}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
            cell.appendChild(button);
          });
          if (items.length > 3) { const more = document.createElement('div'); more.className = 'more'; more.textContent = `+${items.length - 3} more`; cell.appendChild(more); }
          calendarGrid.appendChild(cell);
        }
      }

      function renderTasks() {
        taskList.innerHTML = '';
        emptyTasks.hidden = state.tasks.length > 0;
        state.tasks.forEach((task, index) => {
          const li = document.createElement('li');
          li.className = 'task-row';
          li.draggable = true;
          li.dataset.taskId = task.id;
          const overdue = parseLocal(task.due) < new Date();
          li.innerHTML = `
            <span class="drag-handle" title="Drag to reorder" aria-hidden="true">⠿</span>
            <div><div class="task-title">${escapeHtml(task.title)}</div><div class="task-due${overdue ? ' overdue' : ''}">${overdue ? 'Overdue · ' : ''}${formatDateTime(task.due)}</div></div>
            <span class="priority-number" aria-label="Priority ${index + 1}">${index + 1}</span>
            <div class="row-actions">
              <button type="button" data-action="up" aria-label="Move ${escapeHtml(task.title)} up">↑</button>
              <button type="button" data-action="down" aria-label="Move ${escapeHtml(task.title)} down">↓</button>
              <button type="button" class="remove" data-action="remove" aria-label="Remove ${escapeHtml(task.title)}">×</button>
            </div>`;
          li.addEventListener('dragstart', event => { draggedTaskId = task.id; li.classList.add('dragging'); event.dataTransfer.effectAllowed = 'move'; });
          li.addEventListener('dragend', () => { draggedTaskId = null; li.classList.remove('dragging'); });
          li.addEventListener('dragover', event => event.preventDefault());
          li.addEventListener('drop', event => { event.preventDefault(); if (draggedTaskId && draggedTaskId !== task.id) moveTask(draggedTaskId, state.tasks.findIndex(item => item.id === task.id)); });
          li.addEventListener('click', event => {
            const action = event.target.dataset.action;
            if (action === 'remove') removeTask(task.id);
            if (action === 'up') moveTask(task.id, Math.max(0, index - 1));
            if (action === 'down') moveTask(task.id, Math.min(state.tasks.length - 1, index + 1));
          });
          taskList.appendChild(li);
        });
      }

      function escapeHtml(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
      function moveTask(id, newIndex) { const oldIndex = state.tasks.findIndex(task => task.id === id); if (oldIndex < 0 || oldIndex === newIndex) return; const [task] = state.tasks.splice(oldIndex, 1); state.tasks.splice(newIndex, 0, task); saveState(); render(); }
      function removeTask(id) { state.tasks = state.tasks.filter(task => task.id !== id); saveState(); render(); }

      function openEventDialog() {
        const start = new Date(); start.setMinutes(Math.ceil(start.getMinutes() / 30) * 30, 0, 0);
        const end = new Date(start); end.setHours(end.getHours() + 1);
        document.querySelector('#eventStart').value = localDateTime(start);
        document.querySelector('#eventEnd').value = localDateTime(end);
        openDialog(eventDialog); document.querySelector('#eventTitle').focus();
      }
      function openTaskDialog() {
        const due = new Date(); due.setDate(due.getDate() + 1); due.setHours(23, 59, 0, 0);
        document.querySelector('#taskDue').value = localDateTime(due);
        openDialog(taskDialog); document.querySelector('#taskTitle').focus();
      }
      function showEventDetail(id) {
        const event = state.events.find(item => item.id === id); if (!event) return;
        selectedEventId = id; document.querySelector('#detailTitle').textContent = event.title;
        document.querySelector('#detailTime').textContent = `${formatDateTime(event.start)} – ${formatDateTime(event.end)}`;
        openDialog(detailDialog);
      }

      document.querySelector('#eventForm').addEventListener('submit', event => {
        event.preventDefault(); const data = new FormData(event.currentTarget);
        const start = data.get('start'); const end = data.get('end');
        if (end <= start) { const input = document.querySelector('#eventEnd'); input.setCustomValidity('End time must be after the start time.'); input.reportValidity(); input.addEventListener('input', () => input.setCustomValidity(''), { once: true }); return; }
        state.events.push({ id: makeId(), title: data.get('title').trim(), start, end }); saveState(); event.currentTarget.reset(); closeDialog(eventDialog); viewedMonth = new Date(parseLocal(start).getFullYear(), parseLocal(start).getMonth(), 1); render();
      });
      document.querySelector('#taskForm').addEventListener('submit', event => {
        event.preventDefault(); const data = new FormData(event.currentTarget); const due = data.get('due');
        state.tasks.push({ id: makeId(), title: data.get('title').trim(), due }); state.tasks.sort((a,b) => a.due.localeCompare(b.due)); saveState(); event.currentTarget.reset(); closeDialog(taskDialog); viewedMonth = new Date(parseLocal(due).getFullYear(), parseLocal(due).getMonth(), 1); render();
      });
      document.querySelectorAll('.close-dialog').forEach(button => button.addEventListener('click', () => closeDialog(button.closest('dialog'))));
      document.querySelector('#deleteEvent').addEventListener('click', () => { if (selectedEventId) { state.events = state.events.filter(event => event.id !== selectedEventId); saveState(); closeDialog(detailDialog); render(); } });
      document.querySelector('#addEventButton').addEventListener('click', openEventDialog);
      document.querySelector('#addTaskButton').addEventListener('click', openTaskDialog);
      document.querySelector('#addTaskButtonSecondary').addEventListener('click', openTaskDialog);
      document.querySelector('#previousMonth').addEventListener('click', () => { viewedMonth.setMonth(viewedMonth.getMonth() - 1); renderCalendar(); });
      document.querySelector('#nextMonth').addEventListener('click', () => { viewedMonth.setMonth(viewedMonth.getMonth() + 1); renderCalendar(); });
      document.querySelector('#todayButton').addEventListener('click', () => { const now = new Date(); viewedMonth = new Date(now.getFullYear(), now.getMonth(), 1); renderCalendar(); });

      function registerWebMcpTools() {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const register = tool => { try { Promise.resolve(context.registerTool(tool)).catch(() => {}); } catch (_) {} };
